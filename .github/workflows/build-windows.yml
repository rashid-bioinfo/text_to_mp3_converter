name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyttsx3 pydub

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name TextToMP3 text_to_mp3_gui.py

      - name: Test EXE exists
        run: |
          if (!(Test-Path "dist/TextToMP3.exe")) {
            throw "EXE was not created"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TextToMP3-Windows
          path: dist/TextToMP3.exe
